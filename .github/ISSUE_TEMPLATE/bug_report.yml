name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. a1b2c3d
  - type: dropdown
    id: hosting
    attributes:
      label: Where are you running it?
      options: [Local dev, Dokploy, Railway, Heroku, DigitalOcean, Other Docker host]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove guest names, emails, phone numbers and secrets before posting.
